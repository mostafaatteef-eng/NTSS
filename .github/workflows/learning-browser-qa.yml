name: NTSS learning experience browser QA
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  learning-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      NTSS_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start local HTTPS server
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 -keyout /tmp/ntss-test-key.pem -out /tmp/ntss-test-cert.pem -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" >/dev/null 2>&1
          sudo cp /tmp/ntss-test-cert.pem /usr/local/share/ca-certificates/ntss-test.crt
          sudo update-ca-certificates >/dev/null
          node scripts/qa-https-server.mjs > /tmp/ntss-server.log 2>&1 &
          echo $! > /tmp/ntss-server.pid
      - name: Wait for local server
        run: |
          for i in {1..20}; do
            if curl --insecure --silent --fail https://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ntss-server.log
          exit 1
      - name: Cross-device learning QA
        run: node learning-browser-qa.cjs
      - name: Upload screenshots and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntss-learning-qa-${{ matrix.browser }}
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Show server errors
        if: failure()
        run: cat /tmp/ntss-server.log
