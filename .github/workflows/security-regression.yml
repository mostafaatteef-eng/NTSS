name: NTSS security regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Security regression tests (not a penetration test)
        run: node --test ui-events-tests.cjs audit-round2-tests.cjs security-tests.cjs applied-missions-tests.cjs learning-improvements-tests.cjs quality-workflow-tests.cjs content-clarity-tests.cjs content-release-tests.cjs
