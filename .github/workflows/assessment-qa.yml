name: NTSS Assessment QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assessment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural assessment tests
        run: |
          node scripts/assessment-qa.mjs
          node scripts/assessment-grader-qa.mjs
          node scripts/performance-qa.mjs
          node scripts/certificate-coverage-qa.mjs
          node scripts/all-lessons-qa.mjs
          node scripts/data-analysis-qa.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium firefox webkit
      - name: Responsive Chromium and live workers
        run: NTSS_BROWSER=chromium node scripts/assessment-browser-qa.mjs
      - name: Bilingual lesson lab integration
        run: node scripts/lab-integration-qa.mjs
      - name: Upload lesson lab review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-lab-integration
          path: qa-artifacts/lab-integration
          if-no-files-found: ignore
      - name: Responsive Firefox
        run: NTSS_BROWSER=firefox node scripts/assessment-browser-qa.mjs
      - name: Responsive WebKit
        run: NTSS_BROWSER=webkit node scripts/assessment-browser-qa.mjs
