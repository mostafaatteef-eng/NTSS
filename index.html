"use strict";const D=window.EBDAA_DATA;const $=q=>document.querySelector(q);const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const app=$("#app");let grade=1,year2Unit=0,mode="home",unit=1,selectedId=null,step=0,answer=null,checked=false,hint=false,labValue=2,score=0;const icons=["⌘","∑","▥","✦","◎","⌬"],desc=["Write, test and debug Python programs.","Discover the mathematics behind AI.","Turn raw information into visual stories.","Explore real-world artificial intelligence.","Understand how machines learn from data.","Think with algorithms, trees and graphs."];function nav(n){mode=n;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.nav===n));render();scrollTo(0,0)}function openUnit(n){unit=n;selectedId=D.sessions.find(s=>s.unit===n).id;step=0;answer=null;checked=false;hint=false;labValue=2;nav("learn")}function choose(id){selectedId=id;step=0;answer=null;checked=false;hint=false;labValue=2;render()}function next(){if(step<3){step++;answer=null;checked=false;hint=false;render()}else{let arr=D.sessions.filter(s=>s.unit===unit),k=arr.findIndex(s=>s.id===selectedId);if(k+1<arr.length)choose(arr[k+1].id);else nav("home")}}function back(){if(step>0){step--;answer=null;checked=false;render()}else nav("home")}function chooseAnswer(n){if(checked)return;answer=n;render()}function verify(){if(answer===null)return;checked=true;const expected=step===3?window.EBDAA_CHALLENGE(current()).answer:current().answer;if(answer===expected)score++;render()}function current(){return D.sessions.find(s=>s.id===selectedId)}function label(){return '<div class="eyebrow">EBDAA NATIONAL TECHNICAL SCIENCE SCHOOLS · BADR</div>'}
function chooseGrade(n){grade=n;nav("browse")}
function chooseSubject(){nav("subject")}
function chooseGradeUnit(n){if(grade===1){openUnit(n+1)}else{year2Unit=n;nav("unitPreview")}}
function home(){const labels=["First Year","Second Year","Third Year"],descriptions=["Foundations of programming, mathematics and AI.","Advanced programming, databases and machine learning.","Statistics, annotation, data governance, privacy and applied machine learning."];return '<div class="hero"><div>'+label()+'<h1>Learn at your<br><span style="color:#169a91">own level.</span></h1><p>Choose your academic year, open a subject and explore its units. Free access, no student accounts.</p><div class="no-data">Your learning content is organized by academic year → subject → semester → unit → session.</div></div><div class="hero-art"><span class="float a">Explore · Practice · Understand</span><span class="float b">YEAR 1 / 2 / 3</span></div></div><div class="section-title"><h2>Choose your academic year</h2><span class="count">OPEN LEARNING</span></div><div class="cards">'+labels.map((name,i)=>'<article class="course"><div class="course-art"><i>'+String(i+1).padStart(2,"0")+'</i></div><div class="course-body"><small>GRADE '+(i+1)+'</small><h3>'+name+'</h3><p>'+descriptions[i]+'</p><button onclick="chooseGrade('+(i+1)+')">View subjects ↗</button></div></article>').join("")+'</div>'}
function browse(){const g=window.EBDAA_GRADES.grades.find(g=>g.id===grade);const count=g.subjects.length;return '<div class="eyebrow"><a href="#" onclick="nav(\'home\');return false">All years</a> / YEAR '+grade+'</div><h1>'+esc(g.name)+'</h1><p>Select a subject to explore its curriculum, organized by term and unit.</p>'+(count?'<div class="cards">'+g.subjects.map(s=>'<article class="course"><div class="course-art"><i>AI</i></div><div class="course-body"><small>TECHNICAL SPECIALIZATION · '+(grade===1?"INTERACTIVE":"INDEX AVAILABLE")+'</small><h3>'+esc(s.name)+'</h3><p>'+ (grade===1?"Six units · 39 interactive learning sessions":"Six units · "+(grade===2?41:36)+" curriculum-listed sessions across two semesters")+'</p><button onclick="chooseSubject()">Explore subject ↗</button></div></article>').join("")+'</div>':'<div class="no-data">Third-year subject titles have not been provided yet. This section is ready to receive official curricula. No subjects are invented.</div>')}
function subjectUnits(){const g=window.EBDAA_GRADES.grades.find(g=>g.id===grade),subject=g.subjects[0];if(!subject)return browse();const units=grade===1?D.names.map((title,i)=>({title,term:i<3?1:2,sessions:D.sessions.filter(s=>s.unit===i+1).map(x=>x.title)})):subject.units;return '<div class="eyebrow"><a href="#" onclick="nav(\'home\');return false">Grades</a> / <a href="#" onclick="nav(\'browse\');return false">Year '+grade+'</a> / Subject</div><h1>'+esc(subject.name)+'</h1><p>'+esc(g.name)+' · Browse both semesters and select a unit.</p><div class="unit-strip"><button onclick="nav(\'browse\')">← Back to subjects</button></div>'+[1,2].map(term=>'<div class="section-title"><h2>Term '+term+'</h2><span class="count">'+units.filter(u=>u.term===term).length+' UNITS</span></div><div class="cards">'+units.map((u,i)=>u.term!==term?'':'<article class="course"><div class="course-art"><i>'+icons[i]+'</i></div><div class="course-body"><small>UNIT 0'+(i+1)+'</small><h3>'+esc(u.title)+'</h3><p>'+u.sessions.length+' sessions · '+(grade===1?'Interactive lessons':'Official session index')+'</p><button onclick="chooseGradeUnit('+i+')">'+(grade===1?'Start learning':'View session index')+' ↗</button></div></article>').join("")+'</div>').join("")}
function previewUnit(){const g=window.EBDAA_GRADES.grades.find(g=>g.id===grade),u=g.subjects[0].units[year2Unit];return '<div class="eyebrow"><a href="#" onclick="nav(\'home\');return false">Grades</a> / <a href="#" onclick="nav(\'browse\');return false">Year '+grade+'</a> / <a href="#" onclick="nav(\'subject\');return false">Subject</a></div><div class="pill" style="display:inline-block;margin-top:15px">TERM '+u.term+' · UNIT '+(year2Unit+1)+'</div><h1>'+esc(u.title)+'</h1><p>'+esc(u.source)+'</p><div class="no-data">Session titles are indexed from the uploaded Teacher Guides for Year '+grade+'. Interactive lesson content is pending development; lessons from other years are never substituted.</div><div class="grid" style="display:grid;gap:12px;margin-top:22px">'+u.sessions.map((name,i)=>'<div class="card" style="background:white;border:1px solid #e6e3de;border-radius:15px;padding:18px"><span class="eyebrow">SESSION '+(i+1)+'</span><h3>'+esc(name)+'</h3><p style="font-size:13px">Official curriculum session · Learning activity being prepared</p></div>').join("")+'</div><div class="actions"><button class="btn light" onclick="nav(\'subject\')">← Back to units</button></div>'}
function sourceFor(s){if(s.unit===1)return "First Term Teacher Guide, pp. 5–8 (session map)";if(s.unit===2)return "First Term Teacher Guide, pp. 38–41 (session map)";if(s.unit===3)return "First Term Teacher Guide, pp. 74–76 (session map)";const pages={4:[6,16,27,37,45,55],5:[62,74,85,94,105,113],6:[117,128,139,147,159,169,176]};const part=Number(s.id.split("-")[1])-1;return "Second Term Student Book, p. "+pages[s.unit][part]+" (session starting page); Second Term Teacher Guide for teaching and assessment";}function lab(s){return window.EBDAA_MICRO_RENDER(s)+(window.EBDAA_ADVANCED_LAB(s,labValue)||window.EBDAA_LAB_RENDER(s,labValue))}function setLab(v){labValue=Number(v);render()}function learn(){let sessions=D.sessions.filter(s=>s.unit===unit),s=current();if(!s){return browse()}const blocks=['Try a problem','Play with the idea','Understand why','Check your understanding'];let main='';if(step===0){main='<div class="eyebrow">01 · FIRST, MAKE A PREDICTION</div><h2>What do you already know?</h2><p>'+esc(s.title)+'</p><div class="interactive"><p><b>'+esc(s.question)+'</b></p><div class="choices">'+s.options.map((v,i)=>'<button class="choice '+(answer===i?'chosen ':'')+(checked&&i===s.answer?'correct':'')+(checked&&answer===i&&i!==s.answer?'wrong':'')+'" onclick="chooseAnswer('+i+')">'+String.fromCharCode(65+i)+'. '+esc(v)+'</button>').join('')+'</div>'+(checked?'<div class="feedback '+(answer===s.answer?'':'error')+'"><b>'+(answer===s.answer?'Nice reasoning!':'Not quite — keep exploring.')+'</b><p>'+esc(s.explanation)+'</p></div>':'')+'</div>'}else if(step===1){main='<div class="eyebrow">02 · DISCOVER BY DOING</div><h2>Change something. See what happens.</h2><p>Try moving the control. What pattern do you notice?</p>'+lab(s)}else if(step===2){main='<div class="eyebrow">03 · THE IDEA, MADE SIMPLE</div><h2>'+esc(s.title)+'</h2><div class="interactive"><div style="font-size:44px">✦</div><h3>'+esc(s.topic)+'</h3><p>'+esc(s.explanation)+'</p><div class="hint">Make a connection: explain this idea in your own words before continuing.</div></div>'}else{const challenge=window.EBDAA_CHALLENGE(s);main='<div class="eyebrow">04 · PRACTICE & REFLECT</div><h2>One more question.</h2><p>Can you explain the reasoning, not only pick the correct answer?</p><div class="interactive"><p><b>'+esc(challenge.question)+'</b></p><div class="choices">'+challenge.options.map((v,i)=>'<button class="choice '+(answer===i?'chosen ':'')+(checked&&i===challenge.answer?'correct':'')+(checked&&answer===i&&i!==challenge.answer?'wrong':'')+'" onclick="chooseAnswer('+i+')">'+esc(v)+'</button>').join('')+'</div>'+(checked?'<div class="feedback '+(answer===challenge.answer?'':'error')+'">'+esc(challenge.explanation)+'</div>':'')+'</div>'}return '<div class="topmeta"><span class="eyebrow">UNIT '+unit+' / '+esc(D.names[unit-1])+'</span><span class="pill">CONCEPT '+(sessions.findIndex(x=>x.id===selectedId)+1)+' / '+sessions.length+'</span></div><div class="lesson-layout"><div class="side-list">'+sessions.map((x,i)=>'<button class="'+(x.id===selectedId?'active':'')+'" onclick="choose(\''+x.id+'\')"><span class="stepnum">'+(i+1)+'</span><span>'+esc(x.title)+'</span></button>').join('')+'</div><section class="stage"><div class="stepbar">'+blocks.map((_,i)=>'<span class="'+(i<=step?'on':'')+'"></span>').join('')+'</div>'+main+(hint?'<div class="hint"><b>Thinking hint:</b> '+esc(step===1?'Change the input and compare two outcomes. Explain the pattern you observe.':step===2?'Connect the model to the lesson title. Which variable is changing?':'Eliminate choices that conflict with the definition. Use the experiment before choosing.')+'</div>':'')+'<div class="stepfooter"><button class="btn light" onclick="back()">← Back</button><div style="display:flex;gap:8px"><button class="btn light" onclick="hint=true;render()">Get a hint</button>'+(step===0||step===3?(!checked?'<button class="btn teal" '+(answer===null?'disabled':'')+' onclick="verify()">Check answer →</button>':'<button class="btn teal" onclick="next()">Continue →</button>'):'<button class="btn teal" onclick="next()">Continue →</button>')+'</div></div><div class="source">Curriculum topic based on '+esc(sourceFor(s))+'. Interactive explanations and exercises are supplementary, newly authored learning materials.</div></section></div>'}function about(){return label()+'<h1>For learners, not profiles.</h1><div class="cards"><div class="course-body" style="background:white;border-radius:20px;padding:25px"><h3>✓ No student registration</h3><p>Learn directly without entering your name, email address or school data.</p></div><div class="course-body" style="background:white;border-radius:20px;padding:25px"><h3>✓ No student analytics</h3><p>Answers are used to give immediate feedback in the current browser session. They are not sent to a server.</p></div><div class="course-body" style="background:white;border-radius:20px;padding:25px"><h3>✓ Admin-only editing</h3><p>Content edits are secured by repository permissions and GitHub authentication, not an unsafe login form in a static website.</p></div></div><div class="hint" style="margin-top:24px">Site editing: use the Admin editor link in the header and sign in with an authorized GitHub account. Edit the curriculum source and publish changes using a commit. For a custom in-site CMS, a server-side authenticated backend is required.</div>'}function render(){app.innerHTML=mode==="home"?home():mode==="browse"?browse():mode==="subject"?subjectUnits():mode==="unitPreview"?previewUnit():mode==="learn"?learn():about()}document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>nav(b.dataset.nav)));render();
</script></body></html>
