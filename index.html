/D.sessions.length);function layout(tag,title,lead,inner){out.innerHTML='<div class="tag">'+tag+'</div><h1>'+title+'</h1><p class="lead">'+lead+'</p>'+inner}function home(){layout("WELCOME TO YOUR LEARNING SPACE","Learn something brilliant today.","Six units · 39 short interactive sessions · source-aligned learning checks",'<div class="stats"><div class="stat">Sessions completed<b>'+total()+'/39</b></div><div class="stat">Learning progress<b>'+percent()+'%</b></div><div class="stat">Curriculum units<b>6</b></div></div><div class="bar"><i style="width:'+percent()+'%"></i></div><div class="grid">'+D.names.map((t,i)=>'<div class="card"><span class="tag">UNIT '+(i+1)+' · TERM '+(i<3?1:2)+'</span><h3>'+t+'</h3><p>'+D.sessions.filter(s=>s.unit===i+1).length+' source-traced session activities</p><button onclick="study('+(i+1)+')">Explore unit →</button></div>').join('')+'</div>')}function study(n){unit=n;current=null;chosen=null;revealed=false;showSessions()}function showSessions(){const arr=D.sessions.filter(x=>x.unit===unit);let left='<div class="session-menu">'+arr.map(s=>'<button class="'+(s.id===current?'selected':'')+'" onclick="openSession(\''+s.id+'\')"><small>'+(completed[s.id]?'✓ Completed · ':'')+'Session '+s.id.split('-')[1]+'</small>'+s.title+'</button>').join('')+'</div>';let s=D.sessions.find(x=>x.id===current);let body=s?'<div class="panel"><span class="tag">SESSION '+s.id+'</span><h2>'+s.title+'</h2><p>Key concept: <b>'+s.topic+'</b>. Explore this concept in your approved curriculum, then apply it in the knowledge check below.</p><p class="muted">Learning prompt and review item developed as supplementary material. Textbook pages and instructor demonstrations are not reproduced.</p><hr style="border:0;border-top:1px solid #e4edf5;margin:25px 0"><h3>'+s.question+'</h3><div class="quiz">'+s.options.map((o,i)=>'<button class="'+(chosen===i?'selected ':'')+(revealed&&i===s.answer?'correct':revealed&&i===chosen?'wrong':'')+'" '+(revealed?'disabled':'')+' onclick="pick('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div>'+(revealed?'<div class="feedback">'+(chosen===s.answer?'✓ Correct! ':'Review this idea. ')+s.explanation+'</div>':'')+'<div class="actions"><button class="primary" onclick="study('+unit+')">All sessions</button>'+(revealed?'<button class="primary" onclick="nextSession()">Next session →</button>':'<button class="primary" '+(chosen===null?'disabled':'')+' onclick="check()">Check answer</button>')+'</div></div>':'<div class="panel"><h2>'+D.names[unit-1]+'</h2><p>Select a session to begin. Your knowledge-check progress is stored privately in this browser.</p><div class="bar"><i style="width:'+(100*arr.filter(x=>completed[x.id]).length/arr.length)+'%"></i></div></div>';layout("TERM "+(unit<4?1:2)+" · INTERACTIVE CURRICULUM",D.names[unit-1],"Select a session, review the key idea, and answer a question.",'<div class="actions">'+D.names.map((_,i)=>'<button onclick="study('+(i+1)+')" class="primary" style="background:'+(i+1===unit?'#074481':'#698099')+'">Unit '+(i+1)+'</button>').join('')+'</div><div class="sessions">'+left+body+'</div>')}function openSession(id){current=id;chosen=null;revealed=false;showSessions()}function pick(i){chosen=i;showSessions()}function check(){const s=D.sessions.find(x=>x.id===current);revealed=true;if(chosen===s.answer){completed[s.id]=true;save()}showSessions()}function nextSession(){const arr=D.sessions.filter(x=>x.unit===unit),index=arr.findIndex(s=>s.id===current);if(index<arr.length-1)openSession(arr[index+1].id);else study(unit)}function progress(){layout("LEARNING ANALYTICS","Your progress","Only locally saved progress; this is not a school assessment record.",'<div class="stats"><div class="stat">Completed<b>'+total()+'</b></div><div class="stat">Available<b>39</b></div><div class="stat">Progress<b>'+percent()+'%</b></div></div><div class="grid">'+D.names.map((n,i)=>'<div class="card"><span class="tag">UNIT '+(i+1)+'</span><h3>'+n+'</h3><p>'+D.sessions.filter
