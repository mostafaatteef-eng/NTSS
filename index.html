"use strict";const D=window.EBDAA_DATA;const $=q=>document.querySelector(q);const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const app=$("#app");let mode="home",unit=1,selectedId=null,step=0,answer=null,checked=false,hint=false,labValue=2,score=0;const icons=["⌘","∑","▥","✦","◎","⌬"],desc=["Write, test and debug Python programs.","Discover the mathematics behind AI.","Turn raw information into visual stories.","Explore real-world artificial intelligence.","Understand how machines learn from data.","Think with algorithms, trees and graphs."];function nav(n){mode=n;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.nav===n));render();scrollTo(0,0)}function openUnit(n){unit=n;selectedId=D.sessions.find(s=>s.unit===n).id;step=0;answer=null;checked=false;hint=false;labValue=2;nav("learn")}function choose(id){selectedId=id;step=0;answer=null;checked=false;hint=false;labValue=2;render()}function next(){if(step<3){step++;answer=null;checked=false;hint=false;render()}else{let arr=D.sessions.filter(s=>s.unit===unit),k=arr.findIndex(s=>s.id===selectedId);if(k+1<arr.length)choose(arr[k+1].id);else nav("home")}}function back(){if(step>0){step--;answer=null;checked=false;render()}else nav("home")}function chooseAnswer(n){if(checked)return;answer=n;render()}function verify(){if(answer===null)return;checked=true;if(answer===current().answer)score++;render()}function current(){return D.sessions.find(s=>s.id===selectedId)}function label(){return '<div class="eyebrow">EBDAA NATIONAL TECHNICAL SCIENCE SCHOOLS · BADR</div>'}function home(){return '<div class="hero"><div>'+label()+'<h1>Think it.<br>Try it.<br><span style="color:#169a91">Understand it.</span></h1><p>Interactive challenges in programming, mathematics, data and artificial intelligence. No student accounts, no tracking — just learning by doing.</p><button class="btn teal" onclick="openUnit(1)">Start learning <span>↗</span></button><div class="statline"><span><b>6</b> learning units</span><span><b>'+D.sessions.length+'</b> guided concepts</span><span>Open access</span></div></div><div class="hero-art"><span class="float a">✦ What if...?</span><span class="float b">✓ You figured it out!</span></div></div><div class="section-title"><h2>Explore a learning path</h2><span class="count">YEAR 1 · ALL UNITS</span></div><div class="cards">'+D.names.map((t,i)=>'<article class="course"><div class="course-art"><i>'+icons[i]+'</i></div><div class="course-body"><small>UNIT 0'+(i+1)+' · TERM '+(i<3?1:2)+'</small><h3>'+esc(t)+'</h3><p>'+desc[i]+'</p><button onclick="openUnit('+(i+1)+')">Explore concepts ↗</button></div></article>').join("")+'</div>'}function browse(){return label()+'<h1>Choose your next challenge.</h1><p>Start with a small idea, test it yourself, and uncover the explanation only after trying.</p><div class="cards">'+D.names.map((t,i)=>'<article class="course"><div class="course-art"><i>'+icons[i]+'</i></div><div class="course-body"><small>UNIT '+(i+1)+'</small><h3>'+esc(t)+'</h3><p>'+D.sessions.filter(s=>s.unit===i+1).length+' guided concepts</p><button onclick="openUnit('+(i+1)+')">View lessons ↗</button></div></article>').join("")+'</div>'}function sourceFor(s){return s.unit<=3?"First Term Teacher Guide":"Second Term Student Book / Teacher Guide"}function lab(s){let t=s.unit;let intro='<div class="interactive"><div class="simlabel">✦ Try the interactive model</div>';if(t===1)return intro+'<p>Explore how a loop repeats a command. Change the number of iterations.</p><input class="range" aria-label="Loop repetitions" type="range" min="1" max="8" value="'+labValue+'" oninput="setLab(this.value)"><p><b>'+labValue+'</b> repetitions</p><div class="visual-row">'+Array.from({length:labValue},(_,i)=>'<div class="visual-cell">'+(i+1)+'</div>').join('')+'</div></div>';if(t===2)return intro+'<p>Imagine a fair 6-sided die. Select how many outcomes count as a success.</p><input class="range" aria-label="Successful outcomes" type="range" min="1" max="6" value="'+labValue+'" oninput="setLab(this.value)"><div class="visual-row">'+[1,2,3,4,5,6].map(i=>'<span class="visual-cell" style="background:'+(i<=labValue?'#1ca29a':'#eee9e1')+';color:'+(i<=labValue?'white':'#999')+'">'+i+'</span>').join('')+'</div><p style="text-align:center">P(success) = <b>'+labValue+'/6 = '+Math.round(labValue/6*100)+'%</b></p></div>';if(t===3)return intro+'<p>Adjust the value for category B. Watch how the chart changes.</p><input class="range" aria-label="Category B value" type="range" min="1" max="10" value="'+labValue+'" oninput="setLab(this.value)"><div style="max-width:400px;margin:auto"><div>A — 7<div class="barrow" style="width:70%"></div></div><div>B — '+labValue+'<div class="barrow" style="width:'+(labValue*10)+'%;background:#ffd700"></div></div><div>C — 4<div class="barrow" style="width:40%;background:#cbc0a3"></div></div></div></div>';if(t===4)return intro+'<p>See how a simple classification rule behaves. Move the feature score to see the predicted class.</p><input class="range" aria-label="Feature score" type="range" min="0" max="10" value="'+labValue+'" oninput="setLab(this.value)"><div class="visual-row"><div class="visual-cell">Input: '+labValue+'</div><div style="font-size:30px">→</div><div class="visual-cell" style="background:'+(labValue>=5?'#1ca29a':'#ffeab0')+'">Class '+(labValue>=5?'B':'A')+'</div></div><p class="muted">This is an illustrative rule-based classifier, not a trained machine-learning model.</p></div>';if(t===5)return intro+'<p>Change a hypothetical K value. See how many cluster colors appear in the example.</p><input class="range" aria-label="Cluster count" type="range" min="1" max="6" value="'+labValue+'" oninput="setLab(this.value)"><div class="dots">'+Array.from({length:18},(_,i)=>'<span class="dot" style="left:'+(12+(i*43)%84)+'%;top:'+(12+(i*29)%70)+'%;background:'+['#1ca29a','#f5b924','#aa8bc5','#f17d63','#557bb5','#989583'][i%labValue]+'"></span>').join('')+'</div><p>K = '+labValue+' groups. This illustrates grouping colors; it does not compute K-Means centroids.</p></div>';return intro+'<p>Increase the number of nodes in a linear data structure.</p><input class="range" aria-label="Number of nodes" type="range" min="1" max="7" value="'+labValue+'" oninput="setLab(this.value)"><div class="visual-row">'+Array.from({length:labValue},(_,i)=>'<span class="visual-cell" style="background:'+(i%2?'#ffeab0':'#1ca29a')+';color:'+(i%2?'#222':'white')+'">'+(i+1)+'</span>'+(i<labValue-1?'<b>→</b>':'')).join('')+'</div><p>'+labValue+' nodes connected in sequence.</p></div>'}function setLab(v){labValue=Number(v);render()}function learn(){let sessions=D.sessions.filter(s=>s.unit===unit),s=current();if(!s){return browse()}const blocks=['Try a problem','Play with the idea','Understand why','Check your understanding'];let main='';if(step===0){main='<div class="eyebrow">01 · FIRST, MAKE A PREDICTION</div><h2>What do you already know?</h2><p>'+esc(s.title)+'</p><div class="interactive"><p><b>'+esc(s.question)+'</b></p><div class="choices">'+s.options.map((v,i)=>'<button class="choice '+(answer===i?'chosen ':'')+(checked&&i===s.answer?'correct':'')+(checked&&answer===i&&i!==s.answer?'wrong':'')+'" onclick="chooseAnswer('+i+')">'+String.fromCharCode(65+i)+'. '+esc(v)+'</button>').join('')+'</div>'+(checked?'<div class="feedback '+(answer===s.answer?'':'error')+'"><b>'+(answer===s.answer?'Nice reasoning!':'Not quite — keep exploring.')+'</b><p>'+esc(s.explanation)+'</p></div>':'')+'</div>'}else if(step===1){main='<div class="eyebrow">02 · DISCOVER BY DOING</div><h2>Change something. See what happens.</h2><p>Try moving the control. What pattern do you notice?</p>'+lab(s)}else if(step===2){main='<div class="eyebrow">03 · THE IDEA, MADE SIMPLE</div><h2>'+esc(s.title)+'</h2><div class="interactive"><div style="font-size:44px">✦</div><h3>'+esc(s.topic)+'</h3><p>'+esc(s.explanation)+'</p><div class="hint">Make a connection: explain this idea in your own words before continuing.</div></div>'}else{main='<div class="eyebrow">04 · PRACTICE & REFLECT</div><h2>One more question.</h2><p>Can you explain the reasoning, not only pick the correct answer?</p><div class="interactive"><p><b>'+esc(s.question)+'</b></p><div class="choices">'+s.options.map((v,i)=>'<button class="choice '+(answer===i?'chosen ':'')+(checked&&i===s.answer?'correct':'')+(checked&&answer===i&&i!==s.answer?'wrong':'')+'" onclick="chooseAnswer('+i+')">'+esc(v)+'</button>').join('')+'</div>'+(checked?'<div class="feedback '+(answer===s.answer?'':'error')+'">'+esc(s.explanation)+'</div>':'')+'</div>'}return '<div class="topmeta"><span class="eyebrow">UNIT '+unit+' / '+esc(D.names[unit-1])+'</span><span class="pill">CONCEPT '+sessions.findIndex(x=>x.id===selectedId).toString().replace(/^/, "") .replace(/^0$/,"1")+' / '+sessions.length+'</span></div><div class="lesson-layout"><div class="side-list">'+sessions.map((x,i)=>'<button class="'+(x.id===selectedId?'active':'')+'" onclick="choose(\''+x.id+'\')"><span class="stepnum">'+(i+1)+'</span><span>'+esc(x.title)+'</span></button>').join('')+'</div><section class="stage"><div class="stepbar">'+blocks.map((_,i)=>'<span class="'+(i<=step?'on':'')+'"></span>').join('')+'</div>'+main+(hint?'<div class="hint">Hint: '+esc(s.explanation)+'</div>':'')+'<div class="stepfooter"><button class="btn light" onclick="back()">← Back</button><div style="display:flex;gap:8px"><button class="btn light" onclick="hint=true;render()">Get a hint</button>'+(step===0||step===3?(!checked?'<button class="btn teal" '+(answer===null?'disabled':'')+' onclick="verify()">Check answer →</button>':'<button class="btn teal" onclick="next()">Continue →</button>'):'<button class="btn teal" onclick="next()">Continue →</button>')+'</div></div><div class="source">Curriculum topic based on '+esc(sourceFor(s))+'. Interactive explanations and exercises are supplementary, newly authored learning materials.</div></section></div>'}function about(){return label()+'<h1>For learners, not profiles.</h1><div class="cards"><div class="course-body" style="background:white;border-radius:20px;padding:25px"><h3>✓ No student registration</h3><p>Learn directly without entering your name, email address or school data.</p></div><div class="course-body" style="background:white;border-radius:20px;padding:25px"><h3>✓ No student analytics</h3><p>Answers are used to give immediate feedback in the current browser session. They are not sent to a server.</p></div><div class="course-body" style="background:white;border-radius:20px;padding:25px"><h3>✓ Admin-only editing</h3><p>Content edits are secured by repository permissions and GitHub authentication, not an unsafe login form in a static website.</p></div></div><div class="hint" style="margin-top:24px">Site editing: use the Admin editor link in the header and sign in with an authorized GitHub account. Edit the curriculum source and publish changes using a commit. For a custom in-site CMS, a server-side authenticated backend is required.</div>'}function render(){app.innerHTML=mode==="home"?home():mode==="browse"?browse():mode==="learn"?learn():about()}document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>nav(b.dataset.nav)));render();
</script></body></html>
